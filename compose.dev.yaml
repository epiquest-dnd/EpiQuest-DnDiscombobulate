# Base de données de développement et de test (#22), port publié sur la machine.
# Distincte du produit complet (compose.yaml), dont la base n'est jamais exposée.
#   npm run db:up   (docker compose -f compose.dev.yaml up -d --wait db)
name: epiquest-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: epiquest
      POSTGRES_PASSWORD: epiquest
      POSTGRES_DB: epiquest
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epiquest -d epiquest']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
