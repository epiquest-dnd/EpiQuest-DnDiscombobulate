# Intégration continue (issues #17, #18 et #22).
#
# À chaque PR vers dev ou main, et à chaque push sur ces branches : lint, formatage, types, tests, build du web et de l'image Docker.
# Ces vérifications sont obligatoires pour merger (rulesets de dev et main).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Seules les PR annulent leur exécution précédente : un push sur dev ou main va toujours au bout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Les hooks Git sont inutiles en CI.
  HUSKY: '0'

jobs:
  checks:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base des tests du serveur (#22), même image que compose.dev.yaml.
    # Jetable : identifiants sans valeur hors de la CI.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: epiquest
          POSTGRES_PASSWORD: epiquest
          POSTGRES_DB: epiquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epiquest -d epiquest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatage
        run: npm run format:check

      - name: Types et tests
        run: npm test
        env:
          # Créée et migrée par apps/server/src/test/global-setup.ts.
          TEST_DATABASE_URL: postgres://epiquest:epiquest@localhost:5432/epiquest_test

      - name: Build
        run: npm run build

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérification du fichier Compose
        run: POSTGRES_PASSWORD=ci docker compose config --quiet
