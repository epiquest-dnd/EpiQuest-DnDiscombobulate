name: Bug
description: Signaler un comportement incorrect
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Pense à ajouter le domaine, la taille et le milestone après la création.
  - type: textarea
    id: constat
    attributes:
      label: Ce qui se passe
      description: Le comportement observé, avec le message d'erreur s'il y en a un.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Constater que…
    validations:
      required: true
  - type: dropdown
    id: plateforme
    attributes:
      label: Plateforme
      options:
        - Web
        - Android
        - Serveur
        - Autre
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Environnement
      description: Navigateur, appareil, version ou commit concerné.
  - type: textarea
    id: acceptation
    attributes:
      label: Critères d'acceptation
      value: '- [ ] '
